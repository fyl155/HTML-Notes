<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    用户名：<input type="text"><br><br>
    密码框：<input type="password"><br><br>
    单选框：<input type="radio"><br><br>
    多选框：<input type="checkbox"><br><br>
    上传文件：<input type="file"><br><br>


    <!-- 占位文本 -->
     文本框： <input type="text" placeholder="请输入用户名"><br><br>

     密码框： <input type="password" placeholder="请输入密码"><br><br>


     性别： 
     <input type="radio" name="gender"> 男 
     <input type="radio" name="gender" checked> 女<br><br>
     

     上传文件： <input type="file" multiple><br><br>


     兴趣爱好：
     <input type="checkbox" checked>学习
     <input type="checkbox" checked>看书
     <input type="checkbox" checked>读书
</body>
</html>
