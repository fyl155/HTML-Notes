<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 块级:独占一行;宽度默认是父级的100%; */
        div {
            width: 100px;
            height: 100px;
        }
        .div1 {
            background-color: green;
        }
        .div2 {
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <!-- 块元素 -->
    <div class="div1">div 标签1</div>
    <div class="div2">div 标签2</div>

    <!-- 行内元素 -->
     <span>span1</span>
     <span>span2</span>
</body>
</html>
